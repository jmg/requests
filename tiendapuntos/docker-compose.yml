services:
  db:
    image: postgres:16-alpine
    container_name: tiendapuntos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tiendapuntos
    ports:
      - "5432:5432"
    volumes:
      - tiendapuntos_pgdata:/var/lib/postgresql/data

volumes:
  tiendapuntos_pgdata:
